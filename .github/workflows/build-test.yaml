# Perform continuous integration tests on updates and pull requests
name: Build test
on: [push, pull_request]

jobs:
  build:
    # Firmware CI is only meaningful in the main Klipper repository;
    # this fork carries the tree solely to translate docs/.
    if: github.repository == 'Klipper3d/klipper'
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5

    - name: Setup cache
      uses: actions/cache@v5
      with:
        path: ci_cache
        key: ${{ runner.os }}-build-${{ hashFiles('scripts/ci-install.sh') }}

    - name: Prepare tests
      run: ./scripts/ci-install.sh

    - name: Test
      run: ./scripts/ci-build.sh 2>&1

    - name: Upload micro-controller data dictionaries
      uses: actions/upload-artifact@v4
      with:
        name: data-dict
        path: ci_build/dict
