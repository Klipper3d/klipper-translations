name: Update GetText

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: install mdpo dependency
      run: |
        sudo apt-get update
        sudo apt-get install -y libmd4c-dev libmd4c-html0 libmd4c-html0-dev
    - name: install mdpo
      run: pip install mdpo==2.1.4
    - name: run update-po.py
      run: python ./scripts/update-po.py
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: "locales: Automated Gettext Update(Manually Triggered)"
        title: "locales: Automated Gettext Update"
        branch: create-pull-request/gettext
        committer: GitHub <noreply@github.com>
        signoff: true
        author: GitHub <noreply@github.com>
