name: Update Markdown Output

on:
  push:
    branches:
      - translations
      - weblate-klipper-readme
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: install mdpo dependency
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get update -qq
        sudo -E apt-get install -y --no-install-recommends \
          libmd4c-dev libmd4c-html0 libmd4c-html0-dev
    - name: install mdpo
      run: pip install mdpo==2.1.4
    - name: run update-md.py
      run: python ./scripts/update-md.py
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        commit-message: "locales: Automated Markdown Update"
        title: "locales: Automated Markdown Update"
        branch: create-pull-request/patch
        committer: GitHub <noreply@github.com>
        signoff: true
        author: GitHub <noreply@github.com>
